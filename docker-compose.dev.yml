version: '3.6'

volumes:
  dbdata:

services:
  db:
    image: postgres:11-alpine
    volumes:
      - dbdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=developmentpassword

  web:
    image: incident-response-tool:local
    volumes:
      - .:/app
      - /app/public/packs
    command: ash -c "sleep 5 && bundle exec rails db:create db:migrate && bundle exec rails server -b 0.0.0.0"
    ports:
      - 3000:3000
    depends_on:
      - db
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgresql://postgres:developmentpassword@db/rails-boilerplate
      - SECRET_KEY_BASE=abcd1234
      - RAILS_SERVE_STATIC_FILES=true
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
