version: '3.6'

volumes:
  dbdata:

services:
  db:
    image: postgres:11-alpine
    volumes:
      - dbdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=developmentpassword

  web:
    image: incident-response-tool:local
    volumes:
      - .:/app
    command: ash -c "sleep 5 && apk add --no-cache build-base && mkdir -p /app/public/packs && cp -rf /build_packs/. /app/public/packs/ && bundle config unset without && bundle install && bundle exec rails db:create db:migrate && bundle exec rails server -b 0.0.0.0"
    ports:
      - 3000:3000
    depends_on:
      - db
    environment:
      - RAILS_ENV=development
      - BUNDLE_WITHOUT=
      - DATABASE_URL=postgresql://postgres:developmentpassword@db/rails-boilerplate
      - SECRET_KEY_BASE=abcd1234
      - RAILS_SERVE_STATIC_FILES=true
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BUNDLE_WITHOUT=development:test
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - TEAMS_WEBHOOK_GHBFS=${TEAMS_WEBHOOK_GHBFS}
      - TEAMS_WEBHOOK_EYCDT=${TEAMS_WEBHOOK_EYCDT}
      - TEAMS_WEBHOOK_HEYP=${TEAMS_WEBHOOK_HEYP}
